<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bildschirmschoner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-blur: blur(25px);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            --menu-bg: rgba(10, 10, 10, 0.75);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 1.5s ease-in-out;
            z-index: 1;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        /* DOWN Modus Styling */
        #overlay.layout-down {
            flex-direction: column-reverse;
        }

        #overlay.layout-down #top-center {
            margin-top: 0;
            margin-bottom: 10vh;
        }

        #overlay.layout-down #bottom-center {
            margin-bottom: 0;
            margin-top: 10vh;
        }

        /* Clock & Date Area */
        #top-center {
            margin-top: 10vh;
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease, margin 0.5s ease;
        }

        #clock-container {
            font-size: 11rem;
            font-weight: 800;
            text-shadow: 0px 10px 30px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }

        .digit {
            display: inline-flex;
            justify-content: center;
            position: relative;
            overflow: hidden;
            height: 1.1em;
            line-height: 1.1em;
        }

        .digit-inner {
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        .colon {
            display: inline-block;
            margin: 0 10px;
            padding-bottom: 25px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        #date-container {
            margin-top: -15px;
            font-size: 2.2rem;
            font-weight: 600;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            height: 3rem;
            position: relative;
            width: 800px;
            text-align: center;
        }

        .date-text {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .date-text.active {
            opacity: 1;
        }

        /* Bottom Area (News & Weather) */
        #bottom-center {
            margin-top: 0;
            margin-bottom: 6vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.8s ease, margin 0.5s ease;
            width: 80%;
            max-width: 900px;
        }

        .premium-glass {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            padding: 20px 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #news-container {
            width: 100%;
            min-height: 100px;
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.4;
            display: none;
            position: relative;
            overflow: hidden;
        }

        .news-item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .news-item.active {
            opacity: 1;
        }

        #weather-container {
            display: none;
            gap: 20px;
            padding: 15px 35px;
            border-radius: 100px;
        }

        #weather-info {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 1.6rem;
            font-weight: 600;
        }

        #weather-icon svg {
            width: 45px;
            height: 45px;
            fill: white;
            filter: drop-shadow(0px 2px 8px rgba(0,0,0,0.4));
        }

        /* Update & Error Area */
        #update-container {
            position: absolute;
            bottom: 15vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
            max-width: 80%;
        }

        .update-box {
            background: linear-gradient(135deg, rgba(220, 30, 30, 0.4) 0%, rgba(150, 10, 10, 0.2) 100%);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255, 100, 100, 0.4);
            border-radius: 20px;
            padding: 40px;
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.5;
            box-shadow: 0 10px 40px 0 rgba(200, 0, 0, 0.3);
        }

        /* Secret Menu */
        #settings-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--menu-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #settings-menu.active {
            opacity: 1;
            pointer-events: all;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 20px 40px;
            border-radius: 15px;
            cursor: pointer;
            width: 400px;
            transition: all 0.2s ease;
            outline: none;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        .menu-btn:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: white;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .menu-btn:active {
            transform: scale(0.98);
        }

        #nosleep-video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <video id="nosleep-video" playsinline muted loop>
        <source src="data:video/webm;base64,GkXfowEAAAAAAAAfQoaBAUL3gQFC8oEEQvOBCEKChHdlYm1Ch4ECQoWBAhhTgGcBAAAAAAAVgQFcY8lWTQEAAAAAAH4BAAAAAAAPgQEAAAAAAABHQweFAoUAAAAAAAAB7YEAQvSBB0LygwiFcIUFjxiGgAAAAAAEQp2BAEJTgQEDQ5OBCUVTjwIDU4EFRU6EAAD0AIWIQhUaHhoAAAAAAAAAAAB1gQFAAAABQAAAgQAAAEEBAAAAAAAABRQA2gCAgAAAAAAADZ9AAAAB4EEAAAAAAABAAAAB/wAAAAAAAAAAAAA=" type="video/webm">

    <div id="background"></div>
    <div id="overlay">
        <div id="top-center">
            <div id="clock-container"></div>
            <div id="date-container">
                <div id="date-format-1" class="date-text"></div>
                <div id="date-format-2" class="date-text"></div>
            </div>
        </div>
        
        <div id="bottom-center">
            <div id="news-container" class="premium-glass"></div>

            <div id="weather-container" class="premium-glass">
                <div id="weather-info">
                    <div id="weather-icon"></div>
                    <div id="weather-text">Lokalisierung läuft...</div>
                </div>
            </div>
        </div>

        <div id="update-container">
            <div class="update-box" id="update-text-box">
                UPDATE WIRD DURCHGEFÜHRT<br>
                <span style="font-size: 1.4rem; font-weight: 600; opacity: 0.9; display: block; margin-top: 15px;">
                    Schalten Sie das Gerät NICHT aus. Berühren oder drücken Sie keine Tasten an Fernbedienung, Tastatur oder Maus. Wechseln Sie nicht die Anwendung.
                </span>
            </div>
        </div>
    </div>

    <!-- Geheimes Menü -->
    <div id="settings-menu">
        <h2 style="margin-bottom: 20px; font-weight: 800; letter-spacing: 2px;">SYSTEM-EINSTELLUNGEN</h2>
        <button class="menu-btn" id="btn-wakelock">Bildschirmschoner verhindern: AN</button>
        <button class="menu-btn" id="btn-reload">Seite neu laden</button>
        <button class="menu-btn" id="btn-close">Schließen</button>
    </div>

    <script>
        const GIST_URL = 'https://gist.githubusercontent.com/Kleinlauch/74d97e7cc92125e2442b9e058ab2ebde/raw/command.txt';
        
        let currentModeData = [];
        let dateToggleState = true;
        let lastTimeStr = "";
        let isMenuOpen = false;
        
        let locationName = "Unbekannt";
        let weatherLoaded = false;

        let newsItems = [];
        let currentNewsIndex = 0;
        let dayNewsLoaded = false;
        
        const carFactList = [
            "Car-Fact: Der erste Mercedes-Benz (1926) entstand aus der historischen Fusion der Unternehmen von Gottlieb Daimler und Carl Benz.",
            "Car-Fact: Moderne Automatikgetriebe nutzen einen Drehmomentwandler, um den Motor beim Anhalten vom Antriebsstrang zu trennen, ohne abzuwürgen.",

            "Car-Fact: Ein Formel-1-Auto generiert bei 200 km/h so viel aerodynamischen Abtrieb (Downforce), dass es theoretisch kopfüber an der Decke eines Tunnels fahren könnte.",
            "Car-Fact: Das Magic Body Control Fahrwerk von Mercedes-Benz scannt die Straße per Stereo-Kamera und passt die Federung in Bruchteilen von Sekunden pro Rad an Unebenheiten an.",

            "Car-Fact: Ein 800-Volt-Bordnetz erlaubt deutlich dünnere Kabelquerschnitte, spart Gewicht und ermöglicht Ladeleistungen von bis zu 350 kW.",
            "Car-Fact: Die Ackermann-Lenkgeometrie sorgt dafür, dass das kurveninnere Rad stärker einlenkt als das äußere, da es einen kleineren Kurvenradius abfahren muss.",
            "Car-Fact: Das legendäre Porsche PDK (Porsche Doppelkupplungsgetriebe) kann Gänge in Millisekunden wechseln und gilt bis heute als Benchmark für Schaltgeschwindigkeit und Haltbarkeit unter Launch-Control-Belastung.",

            "Car-Fact: Ein MacPherson-Federbein vereint Radführung, Federung und Dämpfung in einem Bauteil. Es ist extrem platzsparend und wird bei fast allen modernen Kompaktwagen an der Vorderachse genutzt.",
            "Car-Fact: Doppelquerlenker-Aufhängungen sind aufwändiger und teurer als MacPherson-Systeme, bieten aber eine wesentlich konstantere Radaufstandsfläche beim Einfedern und Einlenken.",
            "Car-Fact: Das legendäre Mercedes-Benz 300 SL 'Gullwing' (Flügeltürer) Coupé brauchte seine Flügeltüren nicht aus Designgründen, sondern weil sein leichter Gitterrohrrahmen extrem hohe Seitenschweller erforderte.",
            "Car-Fact: Die By-Wire-Technologie ersetzt mechanische Verbindungen durch elektronische Signale. Beim 'Brake-by-Wire' betätigt das Bremspedal nur einen Sensor, der Bremsdruck wird von einem elektrischen Aktuator erzeugt.",
            "Car-Fact: Ein Zweimassenschwungrad (ZMS) sitzt zwischen Motor und Getriebe. Es besteht aus zwei durch Federn verbundenen Massen und absorbiert die harten Drehschwingungen des Verbrennungsmotors."
        ];

        let wakeLock = null;
        let preventSleepEnabled = true;
        const noSleepVideo = document.getElementById('nosleep-video');

        async function enableWakeLock() {
            if (!preventSleepEnabled) return;
            noSleepVideo.play().catch(() => {});
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log("WakeLock API nicht verfügbar, Fallback-Video aktiv.");
                }
            }
        }

        function disableWakeLock() {
            noSleepVideo.pause();
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                enableWakeLock();
            }
        });

        // --- Klick / Keyboard Logik (Menü & Vollbild) ---
        let clickCount = 0;
        let clickTimer;
        let arrowDownCount = 0;
        let arrowDownTimer;

        document.getElementById('overlay').style.pointerEvents = 'none';

        document.addEventListener('click', (e) => {
            if (preventSleepEnabled) enableWakeLock();
            if (isMenuOpen) return;

            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
                if (clickCount >= 4) {
                    openMenu();
                } else if (clickCount >= 2) {
                    toggleFullScreen();
                }
                clickCount = 0;
            }, 350); 
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        const menuEl = document.getElementById('settings-menu');
        const btnWakelock = document.getElementById('btn-wakelock');
        const btnReload = document.getElementById('btn-reload');
        const btnClose = document.getElementById('btn-close');
        const menuButtons = [btnWakelock, btnReload, btnClose];

        function openMenu() {
            isMenuOpen = true;
            menuEl.classList.add('active');
            btnWakelock.focus();
        }

        function closeMenu() {
            isMenuOpen = false;
            menuEl.classList.remove('active');
            document.activeElement.blur();
        }

        btnWakelock.addEventListener('click', () => {
            preventSleepEnabled = !preventSleepEnabled;
            if (preventSleepEnabled) {
                btnWakelock.innerText = "Bildschirmschoner verhindern: AN";
                enableWakeLock();
            } else {
                btnWakelock.innerText = "Bildschirmschoner verhindern: AUS";
                disableWakeLock();
            }
        });

        btnReload.addEventListener('click', () => {
            window.location.reload();
        });

        btnClose.addEventListener('click', closeMenu);

        document.addEventListener('keydown', (e) => {
            if (!isMenuOpen) {
                if (e.key === 'ArrowDown') {
                    arrowDownCount++;
                    clearTimeout(arrowDownTimer);
                    arrowDownTimer = setTimeout(() => {
                        arrowDownCount = 0;
                    }, 5000);

                    if (arrowDownCount >= 4) {
                        openMenu();
                        arrowDownCount = 0;
                        clearTimeout(arrowDownTimer);
                    }
                } else {
                    arrowDownCount = 0;
                }
                return;
            }
            
            const activeIndex = menuButtons.indexOf(document.activeElement);

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                let nextIndex = activeIndex >= 0 ? (activeIndex + 1) % menuButtons.length : 0;
                menuButtons[nextIndex].focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                let prevIndex = activeIndex >= 0 ? (activeIndex - 1 + menuButtons.length) % menuButtons.length : menuButtons.length - 1;
                menuButtons[prevIndex].focus();
            } else if (e.key === 'Escape') {
                closeMenu();
            }
        });

        async function fetchGist() {
            try {
                const response = await fetch(GIST_URL + '?t=' + Date.now(), { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error("HTTP Fehler " + response.status);
                }
                
                const content = await response.text();
                parseCommand(content);
            } catch (error) {
                console.error("Fehler beim Gist-Abruf:", error);
                showSystemError("Verbindung zum Server unterbrochen oder Gist nicht erreichbar.");
            }
        }

        function showSystemError(msg) {
            const updateContainer = document.getElementById('update-container');
            const updateBox = document.getElementById('update-text-box');
            
            document.getElementById('top-center').style.opacity = '0';
            document.getElementById('bottom-center').style.opacity = '0';
            
            updateBox.innerHTML = "SYSTEMFEHLER<br><span style='font-size: 1.4rem; font-weight: 600; opacity: 0.9; display: block; margin-top: 15px;'>" + msg + "</span>";
            updateContainer.style.opacity = '1';
        }

        function parseCommand(content) {
            const lines = content.split('\n').map(l => l.trim());
            if (lines.length < 3) return;

            const imgParts = lines[1].split(';');
            const images = {};
            for (let i = 0; i < imgParts.length; i += 2) {
                if (imgParts[i] && imgParts[i+1]) {
                    images[imgParts[i]] = imgParts[i+1];
                }
            }

            const modes = lines[2].split(';');
            const bgId = modes.pop(); 
            const bgUrl = images[bgId];

            const bgElement = document.getElementById('background');
            if (bgUrl) {
                bgElement.style.backgroundImage = `url(${bgUrl})`;
            } else {
                bgElement.style.backgroundImage = 'none';
            }

            const oldModes = currentModeData.join(';');
            currentModeData = modes;
            
            if (oldModes !== currentModeData.join(';')) {
                const updateBox = document.getElementById('update-text-box');
                updateBox.innerHTML = `UPDATE WIRD DURCHGEFÜHRT<br>
                <span style="font-size: 1.4rem; font-weight: 600; opacity: 0.9; display: block; margin-top: 15px;">
                    Schalten Sie das Gerät NICHT aus. Berühren oder drücken Sie keine Tasten an Fernbedienung, Tastatur oder Maus. Wechseln Sie nicht die Anwendung.
                </span>`;
                
                updateUIVisibility();
                buildNewsArray();
            }
        }

        function updateUIVisibility() {
            const overlay = document.getElementById('overlay');
            const topCenter = document.getElementById('top-center');
            const bottomCenter = document.getElementById('bottom-center');
            const updateContainer = document.getElementById('update-container');
            const weatherContainer = document.getElementById('weather-container');
            const dateContainer = document.getElementById('date-container');
            const newsContainer = document.getElementById('news-container');

            // Leeres Array bedeutet: Der Nutzer hat nur eine Zahl (Bildnummer) in die Gist-Zeile geschrieben.
            if (currentModeData.length === 0) {
                topCenter.style.opacity = '0';
                bottomCenter.style.opacity = '0';
                updateContainer.style.opacity = '0';
                return;
            }

            // Flexbox-Layout drehen (DOWN Modus)
            if (currentModeData.includes('DOWN')) {
                overlay.classList.add('layout-down');
            } else {
                overlay.classList.remove('layout-down');
            }

            if (currentModeData.includes('UPDATE')) {
                topCenter.style.opacity = '0';
                bottomCenter.style.opacity = '0';
                updateContainer.style.opacity = '1';
                return;
            } else {
                updateContainer.style.opacity = '0';
            }

            if (currentModeData.includes('CLOCK')) {
                topCenter.style.opacity = '1';
                dateContainer.style.display = currentModeData.includes('DATE') ? 'block' : 'none';
                
                let showBottom = false;

                if (currentModeData.includes('CAR-NEWS') || currentModeData.includes('DAY-NEWS')) {
                    newsContainer.style.display = 'flex';
                    showBottom = true;
                } else {
                    newsContainer.style.display = 'none';
                }

                if (currentModeData.includes('WEATHER')) {
                    weatherContainer.style.display = 'flex';
                    showBottom = true;
                    if (!weatherLoaded) initWeather();
                } else {
                    weatherContainer.style.display = 'none';
                }

                bottomCenter.style.opacity = showBottom ? '1' : '0';
            } else {
                topCenter.style.opacity = '0';
                bottomCenter.style.opacity = '0';
            }
        }

        let lastSecondForClock = -1;

        function clockLoop() {
            if (currentModeData.includes('CLOCK')) {
                const now = new Date();
                const s = now.getSeconds();
                
                if (s !== lastSecondForClock) {
                    lastSecondForClock = s;
                    
                    const hStr = String(now.getHours()).padStart(2, '0');
                    const mStr = String(now.getMinutes()).padStart(2, '0');
                    const sStr = String(s).padStart(2, '0');
                    const timeStr = `${hStr}:${mStr}:${sStr}`;

                    if (lastTimeStr === "") {
                        buildClockHTML(timeStr);
                        lastTimeStr = timeStr;
                    } else if (lastTimeStr !== timeStr) {
                        updateClockHTML(timeStr, lastTimeStr);
                        lastTimeStr = timeStr;
                    }
                }
            }
            requestAnimationFrame(clockLoop);
        }

        function buildClockHTML(timeStr) {
            const container = document.getElementById('clock-container');
            container.innerHTML = '';
            for (let char of timeStr) {
                if (char === ':') {
                    container.innerHTML += `<span class="colon">:</span>`;
                } else {
                    container.innerHTML += `<span class="digit"><span class="digit-inner">${char}</span></span>`;
                }
            }
        }

        function updateClockHTML(newTime, oldTime) {
            const container = document.getElementById('clock-container');
            const digits = container.querySelectorAll('.digit-inner');
            let digitIndex = 0;

            for (let i = 0; i < newTime.length; i++) {
                if (newTime[i] === ':') continue;
                
                if (newTime[i] !== oldTime[i]) {
                    const el = digits[digitIndex];
                    
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(-100%)';
                    
                    setTimeout(() => {
                        el.innerText = newTime[i];
                        el.style.transition = 'none';
                        el.style.transform = 'translateY(100%)';
                        
                        void el.offsetWidth;
                        
                        el.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease';
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)';
                    }, 200);
                }
                digitIndex++;
            }
        }

        function updateDate() {
            if (!currentModeData.includes('DATE')) return;

            const now = new Date();
            const format1El = document.getElementById('date-format-1');
            const format2El = document.getElementById('date-format-2');

            const options1 = { weekday: 'long', day: 'numeric', month: 'long' };
            const str1 = now.toLocaleDateString('de-DE', options1);

            const weekday = now.toLocaleDateString('de-DE', { weekday: 'long' });
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const str2 = `${weekday}, ${day}.${month}.${year}`;

            format1El.innerText = str1;
            format2El.innerText = str2;

            if (dateToggleState) {
                format1El.classList.add('active');
                format2El.classList.remove('active');
            } else {
                format1El.classList.remove('active');
                format2El.classList.add('active');
            }
            dateToggleState = !dateToggleState;
        }

        async function buildNewsArray() {
            let tempNews = [];
            
            if (currentModeData.includes('CAR-NEWS')) {
                const shuffledCars = [...carFactList].sort(() => 0.5 - Math.random());
                tempNews = tempNews.concat(shuffledCars.slice(0, 15));
            }

            if (currentModeData.includes('DAY-NEWS')) {
                if (!dayNewsLoaded) {
                    const now = new Date();
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    const dd = String(now.getDate()).padStart(2, '0');
                    try {
                        const res = await fetch(`https://de.wikipedia.org/api/rest_v1/feed/onthisday/events/${mm}/${dd}`);
                        if(res.ok) {
                            const data = await res.json();
                            const events = data.events.sort(() => 0.5 - Math.random()).slice(0, 8);
                            events.forEach(e => {
                                tempNews.push(`Heute vor ${now.getFullYear() - e.year} Jahren (${e.year}): ${e.text}`);
                            });
                            dayNewsLoaded = true;
                        }
                    } catch(e) {
                        console.log("Wikipedia API nicht erreichbar.");
                    }
                }
            }

            if (tempNews.length > 0) {
                newsItems = tempNews.sort(() => 0.5 - Math.random());
                renderNews();
            }
        }

        function renderNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            newsItems.forEach((newsText, index) => {
                const div = document.createElement('div');
                div.className = 'news-item';
                div.innerText = newsText;
                if (index === 0) div.classList.add('active');
                container.appendChild(div);
            });
        }

        function rotateNews() {
            if (newsItems.length <= 1) return;
            const items = document.querySelectorAll('.news-item');
            if (items.length === 0) return;

            items[currentNewsIndex].classList.remove('active');
            currentNewsIndex = (currentNewsIndex + 1) % items.length;
            items[currentNewsIndex].classList.add('active');
        }

        function initWeather() {
            weatherLoaded = true;
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => fetchWeatherData(position.coords.latitude, position.coords.longitude),
                    error => console.warn("Standort blockiert oder Fehler", error)
                );
            }
        }

        async function fetchWeatherData(lat, lon) {
            try {
                const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=de`);
                const geoData = await geoRes.json();
                locationName = geoData.city || geoData.locality || "Unbekannt";

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=precipitation_probability_max&timezone=auto`);
                const wData = await weatherRes.json();
                
                const temp = Math.round(wData.current_weather.temperature);
                const code = wData.current_weather.weathercode;
                const rainProb = wData.daily.precipitation_probability_max[0];
                
                renderWeather(temp, code, rainProb);
            } catch (error) {
                console.error("Wetter Fehler", error);
            }
        }

        function renderWeather(temp, code, rainProb) {
            const weatherText = document.getElementById('weather-text');
            const weatherIcon = document.getElementById('weather-icon');
            
            let condition = "Gutes Wetter";
            let svgIcon = "";
            let extraText = rainProb > 40 ? ` - Regenwahrscheinlichkeit ${rainProb}%` : "";
            
            if (code <= 1) {
                condition = "Klarer Himmel";
                svgIcon = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="white"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>`;
            } else if (code <= 3) {
                condition = "Bewölkt";
                svgIcon = `<svg viewBox="0 0 24 24"><path d="M6.5 17.5A3.5 3.5 0 0 1 3 14c0-1.85 1.4-3.38 3.2-3.49A5.5 5.5 0 0 1 11.5 6a5.5 5.5 0 0 1 5.38 4.34 4 4 0 0 1 3.62 3.91 4 4 0 0 1-4 4H6.5z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>`;
            } else if (code <= 69) {
                condition = "Regnerisch";
                extraText = "";
                svgIcon = `<svg viewBox="0 0 24 24"><path d="M16 13v8M8 13v8M12 15v8M12 15v8M6.5 17.5A3.5 3.5 0 0 1 3 14c0-1.85 1.4-3.38 3.2-3.49A5.5 5.5 0 0 1 11.5 6a5.5 5.5 0 0 1 5.38 4.34 4 4 0 0 1 3.62 3.91" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            } else {
                condition = "Stürmisch oder Schnee";
                svgIcon = `<svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07L19.07 4.93" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>`;
            }

            weatherIcon.innerHTML = svgIcon;
            weatherText.innerHTML = `${temp}°C in ${locationName} - ${condition}${extraText}`;
        }

        setInterval(fetchGist, 5000);
        setInterval(updateDate, 5000);
        setInterval(rotateNews, 12000);

        fetchGist();
        requestAnimationFrame(clockLoop);

    </script>
</body>
</html>
